name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: it_hub_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/it_hub_erp?schema=public
      TEST_DATABASE_URL: postgresql://erp:erp@localhost:5432/it_hub_erp_test?schema=public
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      # CI-only throwaway credentials for the seeded admin used by the e2e tests.
      SEED_ADMIN_EMAIL: e2e-admin@example.com
      SEED_ADMIN_PASSWORD: ci-only-password-123

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma validate
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Check migrations match the schema (no drift)
        run: npm run db:check
      - name: Create the integration test database
        run: PGPASSWORD=erp psql -h localhost -U erp -d it_hub_erp -c "CREATE DATABASE it_hub_erp_test"
      - name: Seed the database
        run: npm run db:seed

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
